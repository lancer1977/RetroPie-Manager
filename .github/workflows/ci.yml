name: ci

on:
  push:
    branches: [ retropie ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retropie-manager-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository shape
        run: bash scripts/validate.sh
